apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-ingress
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    - repoURL: https://github.com/Truong-Giangg/meIOT-argocd-deploy.git
      targetRevision: meiot-shared-prd
      path: helm/grafana-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
