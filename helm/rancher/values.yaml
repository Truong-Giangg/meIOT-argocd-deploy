# Rancher UI - Helm Values
# Chart: rancher/rancher (stable channel)
# Docs: https://ranchermanager.docs.rancher.com/getting-started/installation-and-upgrade/install-upgrade-on-a-kubernetes-cluster

hostname: rancher.meiot.site

replicas: 1

ingress:
  enabled: true
  ingressClassName: nginx
  tls:
    source: letsEncrypt

letsEncrypt:
  email: admin@meiot.site
  ingress:
    class: nginx

bootstrapPassword: ""   # leave empty → auto-generated; retrieve with: kubectl get secret --namespace cattle-system bootstrap-secret -o go-template='{{.data.bootstrapPassword|base64decode}}'

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# Disable bundled cert-manager (we already have it installed)
certmanager:
  version: ""
