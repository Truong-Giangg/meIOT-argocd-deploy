apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://charts.longhorn.io
      targetRevision: 1.11.1
      helm:
        releaseName: longhorn
        valueFiles:
          - $gitRepo/helm/longhorn/values.yaml
      chart: longhorn
    - repoURL: 'https://github.com/Truong-Giangg/meIOT-argocd-deploy.git'
      path: helm/longhorn
      targetRevision: meiot-shared-prd
      ref: gitRepo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
