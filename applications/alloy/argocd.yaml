apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  sources:
    # Source 1: The Grafana Helm Repository
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 0.2.0
      helm:
        valueFiles:
          - $gitRepo/helm/alloy/values.yaml
    # Source 2: Your Private Git Repo for values
    - repoURL: https://github.com/Truong-Giangg/meIOT-argocd-deploy.git
      targetRevision: meiot-shared-prd
      ref: gitRepo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true